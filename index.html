<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riftbound Singles | Crate Drop Collective</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to your existing portal CSS -->
    <style>
        :root {
            --accent-gold: #c4a46c;
            --dark-bg: #0f1113;
            --card-bg: #1a1d21;
            --text-light: #e0e0e0;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header-section {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid #333;
        }

        .singles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            padding: 40px 0;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card-item {
            background: var(--card-bg);
            border: 1px solid #2a2e33;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card-item:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
        }

        .card-img-container {
            position: relative;
            background: #000;
            aspect-ratio: 2.5 / 3.5;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .card-rarity {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .card-price {
            font-size: 1.25rem;
            color: var(--accent-gold);
            font-weight: 800;
            margin-top: auto;
        }

        .buy-btn {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 12px;
            width: 100%;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 15px;
            border-radius: 6px;
        }

        .buy-btn:hover {
            background: #d4b47c;
        }

        .filter-bar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 15px;
            padding: 20px 0;
        }

        .filter-input {
            background: #1a1d21;
            border: 1px solid #333;
            color: white;
            padding: 10px;
            border-radius: 4px;
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <section class="header-section">
        <h1>RIFTBOUND SINGLES</h1>
        <p>Official Origins & Spiritforged Inventory</p>
    </section>

    <div class="filter-bar">
        <input type="text" id="searchBar" class="filter-input" placeholder="Search cards by name or set...">
    </div>

    <div class="singles-grid" id="cardContainer">
        <!-- JS will populate cards here -->
    </div>

    <script>
        // Pricing Config
        const MULTIPLIER = 50;
        const CURRENCY_SYMBOL = "₱";

        // Card Data (Example subset - can be expanded to full JSON)
        const riftboundInventory = [
            { id: "RB-001", name: "Sett, The Boss", set: "Origins", rarity: "Overnumbered", tcg_usd: 75.00, img: "https://images.tcgplayer.com/item/sett_boss_200w.jpg" },
            { id: "RB-002", name: "Kai'Sa, Survivor", set: "Origins", rarity: "Epic", tcg_usd: 80.00, img: "https://images.tcgplayer.com/item/kaisa_survivor_200w.jpg" },
            { id: "RB-003", name: "Ahri, Nine-Tailed Fox", set: "Origins", rarity: "Rare", tcg_usd: 3.75, img: "https://images.tcgplayer.com/item/ahri_nine_200w.jpg" },
            { id: "RB-004", name: "Defy", set: "Origins", rarity: "Common", tcg_usd: 0.85, img: "https://images.tcgplayer.com/item/defy_200w.jpg" },
            { id: "RB-005", name: "Karthus - Eternal", set: "Origins", rarity: "Rare", tcg_usd: 4.19, img: "https://images.tcgplayer.com/item/karthus_200w.jpg" },
            { id: "RB-006", name: "Viktor, Machine Herald", set: "Origins", rarity: "Epic", tcg_usd: 18.42, img: "https://images.tcgplayer.com/item/viktor_200w.jpg" }
        ];

        function renderCards(filter = "") {
            const container = document.getElementById('cardContainer');
            container.innerHTML = "";

            const filtered = riftboundInventory.filter(c => 
                c.name.toLowerCase().includes(filter.toLowerCase()) || 
                c.set.toLowerCase().includes(filter.toLowerCase())
            );

            filtered.forEach(card => {
                const phpPrice = (card.tcg_usd * MULTIPLIER).toLocaleString();
                
                const cardHtml = `
                    <div class="card-item">
                        <div class="card-img-container">
                            <img src="${card.img}" alt="${card.name}" class="card-img" onerror="this.src='https://via.placeholder.com/250x350?text=Riftbound+Card'">
                        </div>
                        <div class="card-info">
                            <div class="card-rarity">${card.set} • ${card.rarity}</div>
                            <div class="card-name">${card.name}</div>
                            <div class="card-price">${CURRENCY_SYMBOL}${phpPrice}</div>
                            <button class="buy-btn" onclick="addToCart('${card.id}', '${card.name}', ${card.tcg_usd * MULTIPLIER})">Add to Order</button>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        // Search listener
        document.getElementById('searchBar').addEventListener('input', (e) => renderCards(e.target.value));

        // Checkout Logic (Matching your existing Portal structure)
        function addToCart(id, name, price) {
            let cart = JSON.parse(localStorage.getItem('crateDropCart')) || [];
            const item = { id, name, price, qty: 1, type: 'single' };
            
            const existing = cart.find(i => i.id === id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push(item);
            }

            localStorage.setItem('crateDropCart', JSON.stringify(cart));
            alert(`${name} added to your drop!`);
            // Trigger your portal's global cart update if applicable
            if(window.updatePortalCart) window.updatePortalCart();
        }

        // Initial Load
        renderCards();
    </script>
</body>
</html>
