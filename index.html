<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crate Drop | Order Management Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0b0f1a; color: #f8fafc; }
        .glass-card { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        .input-field { background: #1f2937 !important; border: 1px solid #374151 !important; color: white !important; transition: all 0.2s; }
        .input-field:focus { border-color: #38bdf8 !important; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); outline: none; }
        .status-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 9999px; text-transform: uppercase; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <div class="max-w-7xl mx-auto px-4 pt-8">
        <!-- Header Section -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-6">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-white">
                    <span class="text-sky-500">CRATE DROP</span> COLLECTIVE
                </h1>
                <p class="text-slate-500 text-sm mt-1">Order Fulfillment & Inventory Console</p>
            </div>
            <div class="flex items-center gap-3">
                <div id="syncStatus" class="text-[10px] text-slate-500 uppercase font-bold mr-2">Inventory Ready</div>
                <button onclick="fetchInventory()" class="p-2 bg-slate-800 rounded-lg hover:bg-slate-700 transition" title="Sync Sheet">
                    🔄
                </button>
                <button onclick="exportToCSV()" class="bg-sky-600 hover:bg-sky-500 text-white px-5 py-2.5 rounded-lg transition font-bold text-sm shadow-lg shadow-sky-900/20">
                    Export Orders
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- LEFT: Order Entry & Edit Form -->
            <div class="lg:col-span-5">
                <div class="glass-card p-8 rounded-3xl sticky top-8">
                    <div class="flex justify-between items-center mb-8">
                        <h2 id="formTitle" class="text-xl font-bold flex items-center gap-3">
                            <span class="w-3 h-3 bg-sky-500 rounded-full animate-pulse"></span> New Order
                        </h2>
                        <button id="cancelEdit" onclick="resetForm()" class="hidden text-xs text-red-400 hover:underline">Cancel Edit</button>
                    </div>
                    
                    <form id="orderForm" class="space-y-5">
                        <input type="hidden" id="editOrderId">
                        
                        <div>
                            <label class="block text-[10px] uppercase tracking-widest text-slate-500 mb-2 font-bold">Customer (Messenger Name)</label>
                            <input type="text" id="custName" class="input-field w-full p-3.5 rounded-xl text-sm" placeholder="e.g. Juan Dela Cruz" required>
                        </div>

                        <div>
                            <label class="block text-[10px] uppercase tracking-widest text-slate-500 mb-2 font-bold">Search Product</label>
                            <input list="product-list" id="productSearch" oninput="handleProductSelect()" class="input-field w-full p-3.5 rounded-xl text-sm" placeholder="Type set name or product code...">
                            <datalist id="product-list"></datalist>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[10px] uppercase tracking-widest text-slate-500 mb-2 font-bold">Unit Type</label>
                                <select id="unitType" class="input-field w-full p-3.5 rounded-xl text-sm">
                                    <option value="Unit">Single Unit</option>
                                    <option value="Case">Full Case</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] uppercase tracking-widest text-slate-500 mb-2 font-bold">Quantity</label>
                                <input type="number" id="orderQty" value="1" min="1" class="input-field w-full p-3.5 rounded-xl text-center text-sm font-bold">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[10px] uppercase tracking-widest text-slate-500 mb-2 font-bold">Price per Item (₱)</label>
                                <input type="number" id="orderPrice" class="input-field w-full p-3.5 rounded-xl text-sm font-bold text-sky-400">
                            </div>
                            <div>
                                <label class="block text-[10px] uppercase tracking-widest text-slate-500 mb-2 font-bold">Downpayment (₱)</label>
                                <input type="number" id="downpayment" value="0" class="input-field w-full p-3.5 rounded-xl text-sm font-bold text-emerald-400">
                            </div>
                        </div>

                        <div>
                            <label class="block text-[10px] uppercase tracking-widest text-slate-500 mb-2 font-bold">Log Notes</label>
                            <textarea id="orderNotes" rows="2" class="input-field w-full p-3.5 rounded-xl text-xs" placeholder="Shipping address, special requests, or deal terms..."></textarea>
                        </div>

                        <button type="submit" id="submitBtn" class="w-full bg-white text-black hover:bg-sky-400 hover:text-white font-extrabold py-4 rounded-2xl transition-all duration-300 transform active:scale-95 shadow-xl">
                            LOG ORDER
                        </button>
                    </form>
                </div>
            </div>

            <!-- RIGHT: Management Board -->
            <div class="lg:col-span-7">
                <div class="flex flex-col sm:flex-row gap-4 mb-8 justify-between items-center">
                    <div class="relative w-full sm:w-80">
                        <input type="text" id="searchInput" onkeyup="filterOrders()" placeholder="Search active orders..." class="input-field w-full p-3 pl-10 rounded-full text-xs">
                        <span class="absolute left-4 top-3.5 opacity-30">🔍</span>
                    </div>
                    <div class="flex gap-3">
                        <div class="bg-slate-900 border border-slate-800 px-4 py-2 rounded-2xl text-center">
                            <p class="text-[9px] text-slate-500 uppercase font-bold">Orders</p>
                            <p id="totalCount" class="text-lg font-bold text-white">0</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 px-4 py-2 rounded-2xl text-center">
                            <p class="text-[9px] text-slate-500 uppercase font-bold">Receivables</p>
                            <p id="totalReceivable" class="text-lg font-bold text-emerald-400">₱0</p>
                        </div>
                    </div>
                </div>

                <div class="space-y-4" id="orderList">
                    <!-- Dynamic Orders -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const TSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQBLjsB__nTteTD8pPY7wvfQEQUCqLstkfUb8lgfOV_NpVwraiUU07VxZrKyWsmVPE1vyLtv_6ED9Y/pub?gid=0&single=true&output=tsv';
        
        let inventory = [];
        let orders = JSON.parse(localStorage.getItem('cd_portal_orders')) || [];

        // 1. Sync Inventory from TSV
        async function fetchInventory() {
            document.getElementById('syncStatus').innerText = 'Syncing...';
            try {
                const response = await fetch(TSV_URL);
                const data = await response.text();
                const rows = data.split('\n').slice(1);
                
                inventory = rows.map(row => {
                    const cols = row.split('\t');
                    return {
                        name: cols[0]?.trim(),
                        price: parseFloat(cols[1]?.replace(/[^0-9.-]+/g,"")) || 0
                    };
                }).filter(item => item.name);

                const list = document.getElementById('product-list');
                list.innerHTML = inventory.map(item => `<option value="${item.name}">`).join('');
                document.getElementById('syncStatus').innerText = 'Inventory Synced';
            } catch (err) {
                document.getElementById('syncStatus').innerText = 'Sync Failed';
            }
        }

        function handleProductSelect() {
            const val = document.getElementById('productSearch').value;
            const product = inventory.find(i => i.name === val);
            if (product) document.getElementById('orderPrice').value = product.price;
        }

        // 2. Order Management
        const orderForm = document.getElementById('orderForm');
        orderForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const editId = document.getElementById('editOrderId').value;
            
            const qty = Number(document.getElementById('orderQty').value);
            const price = Number(document.getElementById('orderPrice').value);
            const down = Number(document.getElementById('downpayment').value);
            const total = qty * price;

            const orderData = {
                id: editId ? Number(editId) : Date.now(),
                timestamp: editId ? orders.find(o => o.id == editId).timestamp : new Date().toLocaleString(),
                name: document.getElementById('custName').value,
                product: document.getElementById('productSearch').value,
                unitType: document.getElementById('unitType').value,
                qty: qty,
                price: price,
                downpayment: down,
                total: total,
                balance: total - down,
                notes: document.getElementById('orderNotes').value,
                status: editId ? orders.find(o => o.id == editId).status : 'Pending'
            };

            if (editId) {
                orders = orders.map(o => o.id == editId ? orderData : o);
            } else {
                orders.unshift(orderData);
            }

            saveAndRender();
            resetForm();
        });

        function saveAndRender() {
            localStorage.setItem('cd_portal_orders', JSON.stringify(orders));
            renderOrders(orders);
        }

        function renderOrders(data) {
            const container = document.getElementById('orderList');
            container.innerHTML = '';
            
            let totalBalance = 0;
            data.forEach(o => {
                totalBalance += o.balance;
                const card = document.createElement('div');
                card.className = "glass-card p-6 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition hover:border-slate-600";
                
                const statusColors = { 
                    'Pending': 'bg-amber-500/10 text-amber-500', 
                    'Paid': 'bg-sky-500/10 text-sky-500', 
                    'Shipped': 'bg-emerald-500/10 text-emerald-500',
                    'Cancelled': 'bg-red-500/10 text-red-500'
                };

                card.innerHTML = `
                    <div class="flex-grow">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="status-badge ${statusColors[o.status] || 'bg-slate-800'}">${o.status}</span>
                            <span class="text-[10px] font-mono text-slate-500">${o.timestamp}</span>
                        </div>
                        <h3 class="font-bold text-lg text-white">${o.name}</h3>
                        <p class="text-sm text-slate-400 font-medium">${o.product} <span class="text-sky-500 ml-2">${o.qty} ${o.unitType}(s)</span></p>
                        ${o.notes ? `<p class="text-[11px] text-slate-500 mt-2 bg-black/20 p-2 rounded italic">"${o.notes}"</p>` : ''}
                    </div>
                    <div class="text-right flex flex-col items-end min-w-[140px]">
                        <div class="text-xs text-slate-500 mb-1">Balance Due</div>
                        <div class="text-xl font-black ${o.balance > 0 ? 'text-white' : 'text-emerald-400'}">₱${o.balance.toLocaleString()}</div>
                        <div class="text-[10px] text-slate-600 mb-4">Total: ₱${o.total.toLocaleString()}</div>
                        
                        <div class="flex gap-2">
                            <button onclick="editOrder(${o.id})" class="text-[10px] bg-slate-800 hover:bg-sky-600 px-3 py-1.5 rounded-lg transition">Edit</button>
                            <button onclick="cycleStatus(${o.id})" class="text-[10px] bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg transition">Status</button>
                            <button onclick="deleteOrder(${o.id})" class="text-[10px] text-red-500 hover:bg-red-500/10 px-3 py-1.5 rounded-lg transition">Delete</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('totalCount').innerText = data.length;
            document.getElementById('totalReceivable').innerText = `₱${totalBalance.toLocaleString()}`;
        }

        function editOrder(id) {
            const o = orders.find(order => order.id === id);
            if (!o) return;

            document.getElementById('editOrderId').value = o.id;
            document.getElementById('custName').value = o.name;
            document.getElementById('productSearch').value = o.product;
            document.getElementById('unitType').value = o.unitType;
            document.getElementById('orderQty').value = o.qty;
            document.getElementById('orderPrice').value = o.price;
            document.getElementById('downpayment').value = o.downpayment;
            document.getElementById('orderNotes').value = o.notes;

            document.getElementById('formTitle').innerText = "Editing Order";
            document.getElementById('submitBtn').innerText = "UPDATE ORDER";
            document.getElementById('submitBtn').className = "w-full bg-sky-500 text-white font-extrabold py-4 rounded-2xl transition-all";
            document.getElementById('cancelEdit').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            orderForm.reset();
            document.getElementById('editOrderId').value = "";
            document.getElementById('formTitle').innerHTML = '<span class="w-3 h-3 bg-sky-500 rounded-full animate-pulse"></span> New Order';
            document.getElementById('submitBtn').innerText = "LOG ORDER";
            document.getElementById('submitBtn').className = "w-full bg-white text-black hover:bg-sky-400 hover:text-white font-extrabold py-4 rounded-2xl transition-all";
            document.getElementById('cancelEdit').classList.add('hidden');
        }

        function cycleStatus(id) {
            const stages = ['Pending', 'Paid', 'Shipped', 'Cancelled'];
            orders = orders.map(o => {
                if (o.id === id) {
                    let next = (stages.indexOf(o.status) + 1) % stages.length;
                    return { ...o, status: stages[next] };
                }
                return o;
            });
            saveAndRender();
        }

        function deleteOrder(id) {
            if(confirm('Permanently delete this order record?')) {
                orders = orders.filter(o => o.id !== id);
                saveAndRender();
            }
        }

        function filterOrders() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = orders.filter(o => o.name.toLowerCase().includes(q) || o.product.toLowerCase().includes(q));
            renderOrders(filtered);
        }

        function exportToCSV() {
            let csv = "Date,Customer,Product,Type,Qty,Price,Total,Downpayment,Balance,Status,Notes\n";
            orders.forEach(o => {
                csv += `"${o.timestamp}","${o.name}","${o.product}","${o.unitType}",${o.qty},${o.price},${o.total},${o.downpayment},${o.balance},"${o.status}","${o.notes}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `CrateDrop_Orders_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        fetchInventory();
        renderOrders(orders);
    </script>
</body>
</html>
