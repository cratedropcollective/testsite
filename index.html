<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crate Drop | Order Log System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        input, select, textarea { background: #1e293b !important; border: 1px solid #334155 !important; color: white !important; }
        input:focus { border-color: #38bdf8 !important; outline: none; ring: 1px #38bdf8; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

<div x-data="orderLogger()" x-init="init()" class="max-w-7xl mx-auto">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
        <div>
            <h1 class="text-3xl font-black tracking-tighter">CRATE DROP <span class="text-sky-400">DATABASE</span></h1>
            <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">Order Management & Balance Tracking</p>
        </div>
        <div class="flex gap-2">
            <button @click="exportToCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition flex items-center gap-2">
                <i class="fas fa-file-excel"></i> Export CSV
            </button>
            <button @click="clearAllData()" class="bg-red-900/30 hover:bg-red-600 text-red-400 hover:text-white text-xs font-bold px-4 py-2 rounded-lg border border-red-900/50 transition">
                <i class="fas fa-trash-alt"></i> Clear All
            </button>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <!-- Input Panel -->
        <div class="lg:col-span-4">
            <div class="glass-card p-6 rounded-2xl sticky top-8">
                <h2 class="text-lg font-bold mb-6 flex items-center gap-2">
                    <i class="fas fa-edit text-sky-400"></i>
                    <span x-text="isEditing ? 'Update Order' : 'Log New Order'"></span>
                </h2>

                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Customer Name</label>
                        <input type="text" x-model="form.customerName" class="w-full p-3 rounded-xl text-sm font-bold" placeholder="Juan Dela Cruz">
                    </div>

                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Select Product</label>
                        <select x-model="form.productId" @change="syncPrice" class="w-full p-3 rounded-xl text-sm font-bold">
                            <option value="">-- Browse Inventory --</option>
                            <template x-for="item in inventory" :key="item.id">
                                <option :value="item.id" x-text="item.name"></option>
                            </template>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Format</label>
                            <select x-model="form.isCase" @change="syncPrice" class="w-full p-3 rounded-xl text-sm font-bold">
                                <option :value="false">Unit</option>
                                <option :value="true">Case</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Qty</label>
                            <input type="number" x-model.number="form.qty" class="w-full p-3 rounded-xl text-sm font-bold text-center">
                        </div>
                    </div>

                    <div class="pt-4 border-t border-slate-700">
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-slate-500">Total Price:</span>
                            <span class="font-bold text-sky-400">₱<span x-text="calculateTotal().toLocaleString()"></span></span>
                        </div>
                        <div class="flex justify-between text-xs mb-4">
                            <span class="text-slate-500">Required DP (30%):</span>
                            <span class="font-bold text-emerald-400">₱<span x-text="calculateDP().toLocaleString()"></span></span>
                        </div>
                    </div>

                    <button @click="saveOrder" class="w-full bg-sky-500 hover:bg-sky-400 text-white font-black py-4 rounded-xl uppercase tracking-widest transition-all shadow-lg" :disabled="!form.customerName || !form.productId">
                        <span x-text="isEditing ? 'Confirm Changes' : 'Log Order to Database'"></span>
                    </button>
                    
                    <button x-show="isEditing" @click="resetForm" class="w-full text-xs text-slate-500 hover:text-white mt-2">Cancel Edit</button>
                </div>
            </div>
        </div>

        <!-- Log Panel -->
        <div class="lg:col-span-8">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <div class="relative w-full md:w-72">
                    <input type="text" x-model="search" placeholder="Search orders..." class="w-full p-2 pl-10 rounded-full text-xs">
                    <i class="fas fa-search absolute left-4 top-3 text-slate-600 text-xs"></i>
                </div>
                <div class="flex gap-4">
                    <div class="text-center">
                        <p class="text-[9px] text-slate-500 font-black uppercase">Active Orders</p>
                        <p class="text-xl font-black text-white" x-text="filteredOrders.length"></p>
                    </div>
                    <div class="text-center border-l border-slate-700 pl-4">
                        <p class="text-[9px] text-slate-500 font-black uppercase">Total Receivables</p>
                        <p class="text-xl font-black text-emerald-400">₱<span x-text="totalReceivables.toLocaleString()"></span></p>
                    </div>
                </div>
            </div>

            <div class="space-y-3">
                <template x-for="order in filteredOrders" :key="order.id">
                    <div class="glass-card p-5 rounded-xl border-l-4 border-sky-500 flex flex-col md:flex-row justify-between items-center group transition hover:bg-slate-800/50">
                        <div class="space-y-1">
                            <div class="flex items-center gap-3">
                                <span class="text-[10px] font-mono text-slate-500" x-text="order.date"></span>
                                <span class="text-[9px] bg-sky-900/50 text-sky-300 px-2 py-0.5 rounded font-bold uppercase" x-text="order.isCase ? 'Case' : 'Unit'"></span>
                            </div>
                            <h3 class="font-black text-lg text-white uppercase tracking-tight" x-text="order.customerName"></h3>
                            <p class="text-sm text-slate-400 font-semibold" x-text="order.productName + ' (x' + order.qty + ')'"></p>
                        </div>
                        <div class="text-right flex flex-col items-end gap-3 mt-4 md:mt-0">
                            <div class="space-y-0">
                                <p class="text-[10px] text-slate-500 font-bold uppercase">Balance Remaining</p>
                                <p class="text-xl font-black text-white">₱<span x-text="order.balance.toLocaleString()"></span></p>
                            </div>
                            <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition">
                                <button @click="editOrder(order)" class="text-[10px] bg-slate-700 hover:bg-sky-600 px-3 py-1.5 rounded-lg transition font-bold">EDIT</button>
                                <button @click="deleteOrder(order.id)" class="text-[10px] bg-red-900/20 text-red-500 hover:bg-red-600 hover:text-white px-3 py-1.5 rounded-lg transition font-bold">DELETE</button>
                            </div>
                        </div>
                    </div>
                </template>
                
                <template x-if="filteredOrders.length === 0">
                    <div class="text-center py-20 border-2 border-dashed border-slate-800 rounded-3xl">
                        <i class="fas fa-box-open text-4xl text-slate-700 mb-4"></i>
                        <p class="text-slate-500 font-bold">No orders found in database.</p>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>

<script>
    function orderLogger() {
        return {
            inventory: [],
            orders: [],
            search: '',
            isEditing: false,
            form: {
                id: null,
                customerName: '',
                productId: '',
                productName: '',
                qty: 1,
                isCase: false,
                price: 0,
                date: ''
            },

            async init() {
                // Load Inventory from TSV
                const tsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSQBLjsB__nTteTD8pPY7wvfQEQUCqLstkfUb8lgfOV_NpVwraiUU07VxZrKyWsmVPE1vyLtv_6ED9Y/pub?gid=0&single=true&output=tsv";
                try {
                    const response = await fetch(tsvUrl);
                    const text = await response.text();
                    const rows = text.trim().split('\n').slice(1);
                    this.inventory = rows.map(row => {
                        const cols = row.split('\t').map(c => c.trim());
                        const unitPrice = parseFloat(cols[4]?.replace(/[^0-9.]/g, '')) || 0;
                        return {
                            id: cols[0],
                            name: cols[1],
                            unitPrice: unitPrice,
                            casePrice: unitPrice * (parseInt(cols[5]) || 1)
                        };
                    });
                } catch (e) { console.error("Inventory Load Error", e); }

                // Load saved orders from LocalStorage
                const saved = localStorage.getItem('cd_order_db');
                if (saved) this.orders = JSON.parse(saved);
            },

            syncPrice() {
                const item = this.inventory.find(i => i.id == this.form.productId);
                if (item) {
                    this.form.productName = item.name;
                    this.form.price = this.form.isCase ? item.casePrice : item.unitPrice;
                }
            },

            calculateTotal() {
                return this.form.price * this.form.qty;
            },

            calculateDP() {
                return Math.ceil(this.calculateTotal() * 0.3);
            },

            saveOrder() {
                const total = this.calculateTotal();
                const dp = this.calculateDP();
                const orderData = {
                    ...this.form,
                    id: this.isEditing ? this.form.id : Date.now(),
                    date: this.isEditing ? this.form.date : new Date().toLocaleDateString(),
                    total: total,
                    dp: dp,
                    balance: total - dp
                };

                if (this.isEditing) {
                    const index = this.orders.findIndex(o => o.id === this.form.id);
                    this.orders[index] = orderData;
                } else {
                    this.orders.unshift(orderData);
                }

                this.persist();
                this.resetForm();
            },

            editOrder(order) {
                this.isEditing = true;
                this.form = { ...order };
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            deleteOrder(id) {
                if (confirm('Permanently delete this order from log?')) {
                    this.orders = this.orders.filter(o => o.id !== id);
                    this.persist();
                }
            },

            resetForm() {
                this.isEditing = false;
                this.form = { id: null, customerName: '', productId: '', productName: '', qty: 1, isCase: false, price: 0, date: '' };
            },

            persist() {
                localStorage.setItem('cd_order_db', JSON.stringify(this.orders));
            },

            clearAllData() {
                if (confirm('CRITICAL: Delete EVERYTHING in the database? This cannot be undone.')) {
                    this.orders = [];
                    this.persist();
                }
            },

            exportToCSV() {
                let csv = "Date,Customer,Product,Format,Qty,Total,DP Paid,Balance\n";
                this.orders.forEach(o => {
                    csv += `${o.date},${o.customerName},${o.productName},${o.isCase ? 'Case' : 'Unit'},${o.qty},${o.total},${o.dp},${o.balance}\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `CrateDrop_MasterLog_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
            },

            get filteredOrders() {
                if (!this.search) return this.orders;
                return this.orders.filter(o => 
                    o.customerName.toLowerCase().includes(this.search.toLowerCase()) ||
                    o.productName.toLowerCase().includes(this.search.toLowerCase())
                );
            },

            get totalReceivables() {
                return this.orders.reduce((sum, o) => sum + o.balance, 0);
            }
        }
    }
</script>

</body>
</html>
