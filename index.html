<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; overflow-x: hidden; }
        
        /* The 3D Scene Wrapper */
        .scene {
            perspective: 1000px;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        /* The "Shelf" container */
        .shelf {
            display: flex;
            gap: 50px;
            transform: rotateX(10deg) rotateY(-5deg); /* Angle the storefront */
        }

        .product-card {
            width: 200px;
            height: 300px;
            background: #2d2d2d;
            border: 2px solid #444;
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            text-align: center;
            transform: translateZ(0);
        }

        .product-card:hover {
            transform: translateZ(50px) scale(1.1); /* "Pop out" effect */
            border-color: #00ffcc;
        }

        button {
            background: #00ffcc;
            border: none;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="shelf" id="storefront">
            </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Gunpla RX-78", price: 50 },
            { id: 2, name: "TCG Booster Box", price: 120 },
            { id: 3, name: "Limited Edition Figure", price: 200 }
        ];

        const shelf = document.getElementById('storefront');

        function checkout(product) {
            alert(`Proceeding to checkout for: ${product.name} ($${product.price})`);
            // You can link this to a simple Stripe payment link or a mailto: form
        }

        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <h3>${p.name}</h3>
                <p>$${p.price}</p>
                <button onclick="checkout({name: '${p.name}', price: ${p.price}})">Buy Now</button>
            `;
            shelf.appendChild(card);
        });
    </script>
</body>
</html>
