<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crate Drop | Order Management Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .accent-border { border-left: 4px solid #38bdf8; }
        input, select, textarea { background: #1e293b !important; color: white !important; border: 1px solid #334155 !important; }
        input:focus { border-color: #38bdf8 !important; outline: none; ring: 2px #38bdf8; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                    <span class="text-sky-400">CRATE DROP</span> COLLECTIVE
                </h1>
                <p class="text-slate-400 text-sm italic">Manual Order Processing & Inventory Sync</p>
            </div>
            <div class="flex gap-3">
                <button onclick="fetchInventory()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded border border-slate-700 transition">
                    🔄 Sync Inventory
                </button>
                <button onclick="exportToCSV()" class="text-xs bg-sky-600 hover:bg-sky-500 text-white px-3 py-2 rounded transition font-semibold">
                    Export Data
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- LEFT: Order Entry Form -->
            <div class="lg:col-span-4">
                <div class="glass p-6 rounded-2xl sticky top-8">
                    <h2 class="text-lg font-semibold mb-6 flex items-center gap-2">
                        <span class="w-2 h-2 bg-sky-400 rounded-full"></span> New Messenger Order
                    </h2>
                    
                    <form id="orderForm" class="space-y-4">
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-500 mb-1 font-bold">Customer Name</label>
                            <input type="text" id="custName" class="w-full p-3 rounded-lg" placeholder="Full Name" required>
                        </div>

                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-500 mb-1 font-bold">Product Search</label>
                            <input list="product-list" id="productSearch" oninput="handleProductSelect()" class="w-full p-3 rounded-lg" placeholder="Type to search TSV database...">
                            <datalist id="product-list"></datalist>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs uppercase tracking-wider text-slate-500 mb-1 font-bold">Qty</label>
                                <input type="number" id="orderQty" value="1" min="1" class="w-full p-3 rounded-lg text-center">
                            </div>
                            <div>
                                <label class="block text-xs uppercase tracking-wider text-slate-500 mb-1 font-bold">Price (₱)</label>
                                <input type="number" id="orderPrice" class="w-full p-3 rounded-lg font-bold text-sky-400">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-500 mb-1 font-bold">Messenger Notes</label>
                            <textarea id="orderNotes" rows="3" class="w-full p-3 rounded-lg text-sm" placeholder="Address, payment method, or specific requests..."></textarea>
                        </div>

                        <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-white font-bold py-4 rounded-lg transition shadow-lg shadow-sky-900/20">
                            Log Order
                        </button>
                    </form>
                </div>
            </div>

            <!-- RIGHT: Order List -->
            <div class="lg:col-span-8">
                <div class="flex flex-col md:flex-row gap-4 mb-6 justify-between items-center">
                    <div class="relative w-full md:w-96">
                        <input type="text" id="searchInput" onkeyup="filterOrders()" placeholder="Search active orders..." class="w-full p-2 pl-10 rounded-full text-sm">
                        <span class="absolute left-4 top-2.5 opacity-30">🔍</span>
                    </div>
                    <div class="flex gap-2 text-xs">
                        <span class="bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">Total: <span id="totalCount" class="text-sky-400 font-bold">0</span></span>
                        <span class="bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">Sales: <span id="totalSales" class="text-emerald-400 font-bold">₱0</span></span>
                    </div>
                </div>

                <div class="space-y-3" id="orderList">
                    <!-- Orders injected here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION: Paste your published TSV URL here
        const TSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQBLjsB__nTteTD8pPY7wvfQEQUCqLstkfUb8lgfOV_NpVwraiUU07VxZrKyWsmVPE1vyLtv_6ED9Y/pub?gid=0&single=true&output=tsv';
        
        let inventory = [];
        let orders = JSON.parse(localStorage.getItem('cd_orders')) || [];

        // 1. Fetch Inventory from TSV
        async function fetchInventory() {
            try {
                const response = await fetch(TSV_URL);
                const data = await response.text();
                const rows = data.split('\n').slice(1); // Skip header row
                
                inventory = rows.map(row => {
                    const cols = row.split('\t');
                    return {
                        name: cols[0]?.trim(), // Adjust index based on your sheet layout
                        price: parseFloat(cols[1]?.replace(/[^0-9.-]+/g,"")) || 0 
                    };
                }).filter(item => item.name);

                updateDatalist();
                console.log('Inventory Synced:', inventory.length, 'items');
            } catch (err) {
                console.error('Error fetching inventory:', err);
            }
        }

        function updateDatalist() {
            const list = document.getElementById('product-list');
            list.innerHTML = inventory.map(item => `<option value="${item.name}">`).join('');
        }

        function handleProductSelect() {
            const val = document.getElementById('productSearch').value;
            const product = inventory.find(i => i.name === val);
            if (product) {
                document.getElementById('orderPrice').value = product.price;
            }
        }

        // 2. Manage Orders
        const orderForm = document.getElementById('orderForm');
        orderForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const newOrder = {
                id: Date.now(),
                timestamp: new Date().toLocaleString(),
                name: document.getElementById('custName').value,
                product: document.getElementById('productSearch').value,
                qty: document.getElementById('orderQty').value,
                price: document.getElementById('orderPrice').value,
                total: document.getElementById('orderQty').value * document.getElementById('orderPrice').value,
                notes: document.getElementById('orderNotes').value,
                status: 'Pending'
            };
            orders.unshift(newOrder);
            saveAndRender();
            orderForm.reset();
        });

        function saveAndRender() {
            localStorage.setItem('cd_orders', JSON.stringify(orders));
            renderOrders(orders);
        }

        function renderOrders(data) {
            const container = document.getElementById('orderList');
            container.innerHTML = '';
            
            let totalCash = 0;
            data.forEach(order => {
                totalCash += Number(order.total);
                const card = document.createElement('div');
                card.className = "glass p-5 rounded-xl accent-border flex justify-between items-center group transition hover:border-sky-500";
                card.innerHTML = `
                    <div class="space-y-1">
                        <div class="flex items-center gap-3">
                            <span class="text-xs font-mono text-slate-500">${order.timestamp}</span>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300 uppercase">${order.status}</span>
                        </div>
                        <h3 class="font-bold text-white">${order.name}</h3>
                        <p class="text-sm text-slate-400">${order.product} <span class="text-slate-600">x${order.qty}</span></p>
                        ${order.notes ? `<p class="text-[11px] text-slate-500 italic max-w-sm">"${order.notes}"</p>` : ''}
                    </div>
                    <div class="text-right flex flex-col items-end gap-3">
                        <span class="text-lg font-bold text-sky-400">₱${Number(order.total).toLocaleString()}</span>
                        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition">
                             <button onclick="updateStatus(${order.id})" class="text-[10px] bg-slate-700 px-2 py-1 rounded hover:bg-sky-600">Cycle Status</button>
                             <button onclick="deleteOrder(${order.id})" class="text-[10px] bg-red-900/30 text-red-400 px-2 py-1 rounded hover:bg-red-600 hover:text-white">Delete</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('totalCount').innerText = data.length;
            document.getElementById('totalSales').innerText = `₱${totalCash.toLocaleString()}`;
        }

        function updateStatus(id) {
            const stages = ['Pending', 'Paid', 'Shipped', 'Delivered'];
            orders = orders.map(o => {
                if (o.id === id) {
                    let nextIndex = (stages.indexOf(o.status) + 1) % stages.length;
                    return { ...o, status: stages[nextIndex] };
                }
                return o;
            });
            saveAndRender();
        }

        function deleteOrder(id) {
            if(confirm('Delete this order log?')) {
                orders = orders.filter(o => o.id !== id);
                saveAndRender();
            }
        }

        function filterOrders() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = orders.filter(o => 
                o.name.toLowerCase().includes(query) || 
                o.product.toLowerCase().includes(query)
            );
            renderOrders(filtered);
        }

        function exportToCSV() {
            let csv = "Timestamp,Customer,Product,Qty,Price,Total,Status,Notes\n";
            orders.forEach(o => {
                csv += `"${o.timestamp}","${o.name}","${o.product}",${o.qty},${o.price},${o.total},"${o.status}","${o.notes}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `CrateDrop_Orders_${new Date().toISOString().split('T')[0]}.csv`);
            a.click();
        }

        // Init
        fetchInventory();
        renderOrders(orders);
    </script>
</body>
</html>
