<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Processing Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <div class="max-w-6xl mx-auto p-6">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Order Manager</h1>
                <p class="text-sm text-gray-500">Manually log and track Facebook Messenger orders.</p>
            </div>
            <button onclick="exportToCSV()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm transition">
                Export to CSV
            </button>
        </header>

        <!-- Order Input Form -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8">
            <h2 class="text-lg font-semibold mb-4">Add New Order</h2>
            <form id="orderForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="custName" placeholder="Customer Name" class="border p-2 rounded-md focus:ring-2 focus:ring-blue-500 outline-none" required>
                <input type="text" id="orderItem" placeholder="Item / Set Name" class="border p-2 rounded-md focus:ring-2 focus:ring-blue-500 outline-none" required>
                <div class="flex gap-2">
                    <input type="number" id="orderQty" placeholder="Qty" class="border p-2 rounded-md w-20 focus:ring-2 focus:ring-blue-500 outline-none" required>
                    <input type="number" id="orderTotal" placeholder="Total Price" class="border p-2 rounded-md flex-grow focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <textarea id="orderNotes" placeholder="Additional Notes (Address, Payment Method...)" class="border p-2 rounded-md md:col-span-2 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium p-2 rounded-md transition self-end">
                    Add Order
                </button>
            </form>
        </section>

        <!-- Filters & Summary -->
        <div class="flex flex-wrap gap-4 mb-4 items-center justify-between">
            <div class="flex gap-2">
                <input type="text" id="searchInput" onkeyup="filterOrders()" placeholder="Search customer or item..." class="border p-2 rounded-md text-sm w-64">
                <select id="filterStatus" onchange="filterOrders()" class="border p-2 rounded-md text-sm">
                    <option value="all">All Statuses</option>
                    <option value="Pending">Pending</option>
                    <option value="Paid">Paid</option>
                    <option value="Shipped">Shipped</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>
            <div class="text-sm font-medium text-gray-600">
                Total Orders: <span id="totalCount" class="text-blue-600">0</span>
            </div>
        </div>

        <!-- Orders Table -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-100 border-b">
                    <tr>
                        <th class="p-4 text-sm font-semibold text-gray-600">Date</th>
                        <th class="p-4 text-sm font-semibold text-gray-600">Customer</th>
                        <th class="p-4 text-sm font-semibold text-gray-600">Items</th>
                        <th class="p-4 text-sm font-semibold text-gray-600">Total</th>
                        <th class="p-4 text-sm font-semibold text-gray-600">Status</th>
                        <th class="p-4 text-sm font-semibold text-gray-600">Actions</th>
                    </tr>
                </thead>
                <tbody id="orderList">
                    <!-- Orders will be injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let orders = JSON.parse(localStorage.getItem('orders')) || [];

        const orderForm = document.getElementById('orderForm');
        const orderList = document.getElementById('orderList');

        orderForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const newOrder = {
                id: Date.now(),
                date: new Date().toLocaleDateString(),
                name: document.getElementById('custName').value,
                item: document.getElementById('orderItem').value,
                qty: document.getElementById('orderQty').value,
                total: document.getElementById('orderTotal').value,
                notes: document.getElementById('orderNotes').value,
                status: 'Pending'
            };
            orders.unshift(newOrder);
            saveAndRender();
            orderForm.reset();
        });

        function saveAndRender() {
            localStorage.setItem('orders', JSON.stringify(orders));
            renderOrders(orders);
        }

        function renderOrders(data) {
            orderList.innerHTML = '';
            document.getElementById('totalCount').innerText = data.length;

            data.forEach(order => {
                const row = document.createElement('tr');
                row.className = "border-b hover:bg-gray-50 transition";
                row.innerHTML = `
                    <td class="p-4 text-sm">${order.date}</td>
                    <td class="p-4 text-sm font-medium">${order.name}</td>
                    <td class="p-4 text-sm text-gray-600">${order.item} (x${order.qty})</td>
                    <td class="p-4 text-sm font-bold">₱${Number(order.total).toLocaleString()}</td>
                    <td class="p-4">
                        <select onchange="updateStatus(${order.id}, this.value)" class="text-xs border rounded p-1 ${getStatusClass(order.status)}">
                            <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Paid" ${order.status === 'Paid' ? 'selected' : ''}>Paid</option>
                            <option value="Shipped" ${order.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                            <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                        </select>
                    </td>
                    <td class="p-4">
                        <button onclick="deleteOrder(${order.id})" class="text-red-500 hover:text-red-700 text-xs font-semibold">Delete</button>
                    </td>
                `;
                orderList.appendChild(row);
            });
        }

        function getStatusClass(status) {
            if (status === 'Paid') return 'bg-blue-50 text-blue-700 border-blue-200';
            if (status === 'Shipped') return 'bg-green-50 text-green-700 border-green-200';
            if (status === 'Cancelled') return 'bg-red-50 text-red-700 border-red-200';
            return 'bg-yellow-50 text-yellow-700 border-yellow-200';
        }

        function updateStatus(id, newStatus) {
            orders = orders.map(o => o.id === id ? {...o, status: newStatus} : o);
            saveAndRender();
        }

        function deleteOrder(id) {
            if(confirm('Are you sure you want to remove this order?')) {
                orders = orders.filter(o => o.id !== id);
                saveAndRender();
            }
        }

        function filterOrders() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('filterStatus').value;
            
            const filtered = orders.filter(o => {
                const matchesSearch = o.name.toLowerCase().includes(query) || o.item.toLowerCase().includes(query);
                const matchesStatus = statusFilter === 'all' || o.status === statusFilter;
                return matchesSearch && matchesStatus;
            });
            renderOrders(filtered);
        }

        function exportToCSV() {
            let csvContent = "data:text/csv;charset=utf-8,Date,Customer,Item,Qty,Total,Status,Notes\n";
            orders.forEach(o => {
                csvContent += `${o.date},"${o.name}","${o.item}",${o.qty},${o.total},${o.status},"${o.notes}"\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `orders_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
        }

        // Initial Load
        renderOrders(orders);
    </script>
</body>
</html>
